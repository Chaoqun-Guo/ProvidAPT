# Prometheus configuration for ProvidAPT monitoring
global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: "providapt"
    static_configs:
      - targets: ["localhost:18080"]
    metrics_path: /metrics
    scheme: http
    # Uncomment for TLS:
    # scheme: https
    # tls_config:
    #   ca_file: /etc/providapt/ca.pem
    #   cert_file: /etc/providapt/cert.pem
    #   key_file: /etc/providapt/key.pem
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: "([^:]+):.*"
        replacement: "${1}"

  - job_name: "providapt-watchdog"
    static_configs:
      - targets: ["localhost:9091"]
    metrics_path: /metrics
