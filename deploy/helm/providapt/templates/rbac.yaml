apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "providapt.fullname" . }}-node-reader
  labels:
    {{- include "providapt.labels" . | nindent 4 }}
rules:
  # Required for node-level monitoring and host identification
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/proxy
      - nodes/stats
      - pods
      - pods/log
    verbs:
      - get
      - list
      - watch
  # Required for provisioning node-level security contexts
  - apiGroups: ["security.openshift.io"]
    resources: ["securitycontextconstraints"]
    verbs: ["use"]
    resourceNames:
      - privileged
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "providapt.fullname" . }}-node-reader
  labels:
    {{- include "providapt.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "providapt.fullname" . }}-node-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "providapt.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
# Pod Security Policy (DEPRECATED — policy/v1beta1 removed in K8s 1.25+)
# Use Pod Security Admission instead: https://kubernetes.io/docs/concepts/security/pod-security-admission/
# This block remains for backward compatibility with K8s <1.25 clusters.
{{- if and .Values.psp.create (semverCompare "<1.25" .Capabilities.KubeVersion.Version) }}
apiVersion: policy/v1beta1
kind: PodSecurityPolicy
metadata:
  name: {{ include "providapt.fullname" . }}
  labels:
    {{- include "providapt.labels" . | nindent 4 }}
spec:
  privileged: true
  allowPrivilegeEscalation: true
  allowedCapabilities:
    - BPF
    - SYS_ADMIN
    - NET_ADMIN
    - SYS_PTRACE
    - SYS_RESOURCE
  hostPID: true
  hostNetwork: true
  volumes:
    - hostPath
    - configMap
    - emptyDir
  runAsUser:
    rule: RunAsAny
  seLinux:
    rule: RunAsAny
  fsGroup:
    rule: RunAsAny
  supplementalGroups:
    rule: RunAsAny
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "providapt.fullname" . }}-psp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "providapt.labels" . | nindent 4 }}
rules:
  - apiGroups: ["policy"]
    resources: ["podsecuritypolicies"]
    verbs: ["use"]
    resourceNames:
      - {{ include "providapt.fullname" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "providapt.fullname" . }}-psp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "providapt.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "providapt.fullname" . }}-psp
subjects:
  - kind: ServiceAccount
    name: {{ include "providapt.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
