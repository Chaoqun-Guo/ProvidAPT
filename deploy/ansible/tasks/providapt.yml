# ── ProvidAPT deployment tasks ─────────────────────────────────

- name: Deploy ProvidAPT configuration
  ansible.builtin.template:
    src: providapt.toml.j2
    dest: "{{ providapt_config_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: restart providapt

- name: Pull ProvidAPT Docker image
  community.docker.docker_image:
    name: "{{ providapt_image }}:{{ providapt_version }}"
    source: pull
    state: present

- name: Ensure old ProvidAPT container is removed
  community.docker.docker_container:
    name: "{{ providapt_container_name }}"
    state: absent

- name: Deploy ProvidAPT container
  community.docker.docker_container:
    name: "{{ providapt_container_name }}"
    image: "{{ providapt_image }}:{{ providapt_version }}"
    state: started
    restart_policy: "{{ providapt_restart_policy }}"
    privileged: "{{ providapt_privileged }}"
    network_mode: "{{ providapt_network_mode }}"
    volumes: "{{ providapt_volumes }}"
    env: "{{ providapt_env }}"
  register: providapt_container

- name: Wait for ProvidAPT to become healthy
  ansible.builtin.uri:
    url: "http://localhost{{ providapt_api_rest }}/api/v1/status"
    status_code: 200
  register: health_check
  retries: 15
  delay: 2
  until: health_check.status == 200
  when: providapt_container.status == 'running'

- name: Display ProvidAPT status
  ansible.builtin.debug:
    msg: "ProvidAPT {{ providapt_version }} running on {{ inventory_hostname }}"
