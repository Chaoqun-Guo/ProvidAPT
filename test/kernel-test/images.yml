# Kernel version compatibility test matrix
# Each entry defines a kernel image to test against.
#
# Images are pulled from:
#   - Docker Hub (ubuntu:20.04, etc. — uses host kernel)
#   - QEMU images (for specific kernel versions)
#   - Custom kernel builder (for custom configs)

kernels:
  - version: "5.4"
    distro: "ubuntu"
    tag: "20.04"
    type: "docker"
    features:
      bpf: true
      btf: false
      bpf_lsm: false

  - version: "5.10"
    distro: "ubuntu"
    tag: "20.04"
    type: "docker"
    features:
      bpf: true
      btf: true
      bpf_lsm: false

  - version: "5.11"
