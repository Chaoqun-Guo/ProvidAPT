version: "3.9"

services:
  test:
    build:
      context: .
      dockerfile: build/docker/Dockerfile.ubuntu
    image: providapt:latest
    container_name: providapt-test
    privileged: true
    volumes:
      - /sys/kernel/btf:/sys/kernel/btf:ro
      - .:/workspace
    working_dir: /workspace
    command: >
      bash -c "
        echo '=== ProvidAPT Docker Test Environment ===' &&
        echo 'OS:' && uname -a &&
        echo '' &&
        echo '=== Go Version ===' && go version &&
        echo '' &&
        echo '=== Building ===' && make build-userspace 2>&1 ||
          echo '[WARN] build-userspace incomplete (eBPF deps may be missing)' &&
        echo '' &&
        echo '=== Running Unit Tests ===' &&
        GOPROXY=https://proxy.golang.org,direct go test -v -count=1 ./internal/engine/pipeline/... ./internal/engine/provenance/... ./internal/engine/query/... ./internal/engine/collector/... ./internal/engine/filter/... ./internal/engine/identity/... ./internal/storage/cache/... ./internal/storage/export/... ./internal/policy/alert/... ./internal/policy/response/... ./internal/policy/adaptive/... ./internal/policy/armor/... ./internal/policy/honeypot/... ./pkg/config/... ./pkg/anonymize/... ./pkg/secure/... ./pkg/hwaccel/... 2>&1 | tail -30 &&
        echo '' &&
        echo '=== Running Additional Unit Tests ===' &&
        GOPROXY=https://proxy.golang.org,direct go test -v -count=1 ./internal/engine/pipeline/... ./internal/engine/provenance/... ./internal/storage/schema/... ./internal/policy/alert/... 2>&1 | tail -20 &&
        echo '' &&
        echo '=== Running Supply-Chain Unit Tests ===' &&
        GOPROXY=https://proxy.golang.org,direct go test -v -count=1 ./internal/stitcher/graphsketch/... ./internal/policy/supplychain/... 2>&1 | tail -20 &&
        echo '' &&
        echo '=== Go Vet ===' &&
        GOPROXY=https://proxy.golang.org,direct go vet ./internal/engine/... 2>&1 | head -10 &&
        echo '' &&
        echo '=== Done ==='
      "

  shell:
    build:
      context: .
      dockerfile: build/docker/Dockerfile.ubuntu
    image: providapt:latest
    container_name: providapt-shell
    privileged: true
    volumes:
      - /sys/kernel/btf:/sys/kernel/btf:ro
      - .:/workspace
    working_dir: /workspace
    stdin_open: true
    tty: true
    command: /bin/bash

  # Production-style local deployment
  providapt:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: providapt
    privileged: true
    pid: host
    network_mode: host
    volumes:
      - /sys:/sys:ro
      - /sys/kernel/btf:/sys/kernel/btf:ro
      - /sys/fs/bpf:/sys/fs/bpf:rw
      - providapt-log:/var/log/providapt
      - ./scripts/docker/providapt.toml:/etc/providapt/providapt.toml:ro
    environment:
      PROVIDAPT_LOG_LEVEL: "info"
      PROVIDAPT_OUTPUT_DIR: "/var/log/providapt"
      PROVIDAPT_API_REST: ":8080"
    restart: unless-stopped
    stop_grace_period: 30s

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: providapt-prometheus
    network_mode: host
    volumes:
      - ./scripts/docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    restart: unless-stopped
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:11.2.0
    container_name: providapt-grafana
    network_mode: host
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    restart: unless-stopped
    profiles:
      - monitoring

volumes:
  providapt-log:
  prometheus-data:
  grafana-data:
