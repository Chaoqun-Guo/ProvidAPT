name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  GO_VERSION: "1.22"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang llvm libbpf-dev linux-tools-common linux-tools-generic

      - name: Build core engine packages
        run: |
          go build ./internal/engine/provenance/...
          go build ./internal/engine/pipeline/...
          go build ./internal/engine/analyzer/...
          go build ./internal/engine/collector/...
          go build ./internal/engine/filter/...
          go build ./internal/engine/compact/...
          go build ./internal/engine/query/...
          go build ./internal/engine/control/...
          go build ./internal/engine/identity/...
          go build ./internal/engine/predict/...
          go build ./internal/engine/stream/...
          go build ./internal/engine/probe/...
          go build ./internal/engine/appsync/...
          go build ./internal/engine/backtrace/...
          go build ./internal/engine/profile/...
          go build ./internal/engine/ratelimit/...
          go build ./internal/engine/chain/...
          go build ./internal/engine/container/...
          go build ./internal/engine/fold/...
          go build ./internal/engine/netmon/...
          go build ./internal/engine/viz/...
          go build ./internal/engine/taint/...
          go build ./internal/engine/ja3/...
          go build ./internal/engine/edgereduce/...
          go build ./internal/engine/graphquery/...
          go build ./internal/engine/syscall/...

      - name: Build ML and AI packages
        run: |
          go build ./internal/engine/ml/...
          go build ./internal/engine/ai/...

      - name: Build storage packages
        run: |
          go build ./internal/storage/store/...
          go build ./internal/storage/cache/...
          go build ./internal/storage/format/...
          go build ./internal/storage/export/...
          go build ./internal/storage/schema/...
          go build ./internal/storage/pebblestore/...
          go build ./internal/storage/graphdb/...
          go build ./internal/storage/grpcexport/...
          go build ./internal/storage/snapshot/...

      - name: Build policy packages
        run: |
          go build ./internal/policy/alert/...
          go build ./internal/policy/response/...
          go build ./internal/policy/defense/...
          go build ./internal/policy/heal/...
          go build ./internal/policy/sigma/...
          go build ./internal/policy/honeypot/...
          go build ./internal/policy/armor/...
          go build ./internal/policy/supplychain/...
          go build ./internal/policy/blastradius/...
          go build ./internal/policy/deception/...
          go build ./internal/policy/incident/...
          go build ./internal/policy/mgmt/...
          go build ./internal/policy/respond/...
          go build ./internal/policy/rulescanner/...
          go build ./internal/policy/selfheal/...

      - name: Build remaining packages
        run: |
          go build ./internal/stitcher/...
          go build ./cmd/cli/...
          go build ./pkg/...

      # Skip packages requiring bpf2go or platform-specific syscalls:
      #   internal/engine/loader/       (bpf2go codegen)
      #   internal/engine/forensic/     (syscall.Stat_t on Linux)
      #   internal/engine/opt/          (builds on Linux)
      #   internal/engine/memtrack/     (builds on Linux)
      #   internal/engine/netfinger/    (builds on Linux)
      #   internal/engine/memforensic/  (tab formatting issue)
      #   internal/policy/adaptive/     (builds on Linux)
      #   internal/storage/store/       (pebble API — may fail without CGO)
      #   cmd/agent/ cmd/collector/     (bpf2go codegen)

      - name: Run tests
        run: |
          go test -count=1 -timeout=60s ./internal/engine/provenance/...
          go test -count=1 -timeout=60s ./internal/engine/pipeline/...
          go test -count=1 -timeout=60s ./internal/engine/analyzer/...
          go test -count=1 -timeout=60s ./internal/engine/collector/...
          go test -count=1 -timeout=60s ./internal/engine/filter/...
          go test -count=1 -timeout=60s ./internal/engine/compact/...
          go test -count=1 -timeout=60s ./internal/engine/query/...
          go test -count=1 -timeout=60s ./internal/engine/control/...
          go test -count=1 -timeout=60s ./internal/engine/identity/...
          go test -count=1 -timeout=60s ./internal/engine/predict/...
          go test -count=1 -timeout=60s ./internal/engine/appsync/...
          go test -count=1 -timeout=60s ./internal/engine/backtrace/...
          go test -count=1 -timeout=60s ./internal/engine/chain/...
          go test -count=1 -timeout=60s ./internal/engine/container/...
          go test -count=1 -timeout=60s ./internal/engine/fold/...
          go test -count=1 -timeout=60s ./internal/engine/taint/...
          go test -count=1 -timeout=60s ./internal/engine/ja3/...
          go test -count=1 -timeout=60s ./internal/engine/stream/...
          go test -count=1 -timeout=60s ./internal/engine/probe/...
          go test -count=1 -timeout=60s ./internal/engine/ratelimit/...
          go test -count=1 -timeout=60s ./internal/engine/viz/...

      - name: Run storage and policy tests
        run: |
          go test -count=1 -timeout=60s ./internal/storage/store/...
          go test -count=1 -timeout=60s ./internal/storage/cache/...
          go test -count=1 -timeout=60s ./internal/storage/schema/...
          go test -count=1 -timeout=60s ./internal/storage/graphdb/...
          go test -count=1 -timeout=60s ./internal/storage/snapshot/...
          go test -count=1 -timeout=60s ./internal/storage/export/...
          go test -count=1 -timeout=60s ./internal/storage/grpcexport/...
          go test -count=1 -timeout=60s ./internal/storage/pebblestore/...
          go test -count=1 -timeout=60s ./internal/stitcher/graphsketch/...
          go test -count=1 -timeout=60s ./internal/policy/supplychain/...
          go test -count=1 -timeout=60s ./internal/policy/blastradius/...

      - name: Check Go vet
        run: |
          go vet ./internal/engine/provenance/...
          go vet ./internal/engine/pipeline/...
          go vet ./internal/engine/analyzer/...
          go vet ./internal/engine/collector/...
          go vet ./internal/engine/filter/...
          go vet ./internal/engine/compact/...
          go vet ./internal/engine/query/...
          go vet ./internal/engine/control/...

  loader-smoke:
    name: loader smoke (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install loader smoke dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang llvm libbpf-dev linux-tools-common linux-tools-generic make

      - name: Run kernel probe
        run: |
          bash build/kernel_probe.sh

      - name: Run loader smoke validation
        run: |
          sudo make loader-smoke
