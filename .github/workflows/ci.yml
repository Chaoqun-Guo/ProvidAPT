name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GOTOOLCHAIN: auto
  GOPROXY: https://proxy.golang.org,direct

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.3"
          cache-dependency-path: |
            go.mod
            go.sum

      - name: Download module dependencies
        run: |
          set -o pipefail
          pwd
          ls -la
          test -f go.mod || {
            listing="$(pwd; ls -la)"
            message="$(printf '%s' "$listing" | head -c 8000 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            echo "::error title=go.mod not found in CI workspace::$message"
            exit 1
          }
          go version
          go env GOVERSION GOTOOLCHAIN GOPROXY GOSUMDB
          if ! output="$(go mod download all 2>&1)"; then
            echo "$output"
            message="$(printf '%s' "$output" | head -c 8000 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            echo "::error title=go mod download failed::$message"
            exit 1
          fi

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang llvm libbpf-dev linux-tools-common linux-tools-generic

      - name: Run release-scoped validation
        run: |
          go test ./pkg/ticketing ./pkg/config ./pkg/api ./pkg/notify ./pkg/telemetry ./pkg/alertflow
          go test ./pkg/archive ./internal/storage/format ./internal/engine/container
          go test ./internal/policy/rulescanner ./internal/policy/response ./internal/policy/deception
          go test ./internal/storage/store ./internal/engine/compact ./internal/stitcher/graphsketch ./internal/engine/edgereduce
          GOOS=linux go test -c ./cmd/agent/daemon

  loader-smoke:
    name: loader smoke (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.3"
          cache-dependency-path: |
            go.mod
            go.sum

      - name: Install loader smoke dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang llvm libbpf-dev linux-tools-common linux-tools-generic make

      - name: Run kernel probe
        run: |
          bash build/kernel_probe.sh

      - name: Run loader smoke validation
        run: |
          sudo make loader-smoke
