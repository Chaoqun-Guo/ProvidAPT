name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: |
            go.mod
            go.sum

      - name: Download module dependencies
        run: go mod download

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang llvm libbpf-dev linux-tools-common linux-tools-generic

      - name: Build core engine packages
        run: |
          go build ./internal/engine/provenance/...
          go build ./internal/engine/pipeline/...
          go build ./internal/engine/analyzer/...
          go build ./internal/engine/collector/...
          go build ./internal/engine/filter/...
          go build ./internal/engine/compact/...
          go build ./internal/engine/query/...
          go build ./internal/engine/control/...
          go build ./internal/engine/identity/...
          go build ./internal/engine/predict/...
          go build ./internal/engine/stream/...
          go build ./internal/engine/probe/...
          go build ./internal/engine/appsync/...
          go build ./internal/engine/backtrace/...
          go build ./internal/engine/profile/...
          go build ./internal/engine/ratelimit/...
          go build ./internal/engine/chain/...
          go build ./internal/engine/container/...
          go build ./internal/engine/fold/...
          go build ./internal/engine/netmon/...
          go build ./internal/engine/viz/...
          go build ./internal/engine/taint/...
          go build ./internal/engine/ja3/...
          go build ./internal/engine/edgereduce/...
          go build ./internal/engine/graphquery/...
          go build ./internal/engine/syscall/...
          go build ./internal/engine/memforensic/...

      - name: Build ML and AI packages
        run: |
          go build ./internal/engine/ml/...
          go build ./internal/engine/ai/...

      - name: Build storage packages
        run: |
          go build ./internal/storage/store/...
          go build ./internal/storage/cache/...
          go build ./internal/storage/format/...
          go build ./internal/storage/export/...
          go build ./internal/storage/schema/...
          go build ./internal/storage/pebblestore/...
          go build ./internal/storage/graphdb/...
          go build ./internal/storage/grpcexport/...
          go build ./internal/storage/snapshot/...

      - name: Build policy packages
        run: |
          go build ./internal/policy/alert/...
          go build ./internal/policy/response/...
          go build ./internal/policy/defense/...
          go build ./internal/policy/heal/...
          go build ./internal/policy/sigma/...
          go build ./internal/policy/honeypot/...
          go build ./internal/policy/armor/...
          go build ./internal/policy/supplychain/...
          go build ./internal/policy/blastradius/...
          go build ./internal/policy/deception/...
          go build ./internal/policy/incident/...
          go build ./internal/policy/mgmt/...
          go build ./internal/policy/respond/...
          go build ./internal/policy/rulescanner/...
          go build ./internal/policy/selfheal/...

      - name: Build remaining packages
        run: |
          go build ./internal/stitcher/...
          go build ./cmd/cli/...
          go build ./pkg/...

      # Skip packages requiring bpf2go or platform-specific syscalls:
      #   internal/engine/loader/       (bpf2go codegen)
      #   internal/engine/forensic/     (syscall.Stat_t on Linux)
      #   internal/engine/opt/          (builds on Linux)
      #   internal/engine/memtrack/     (builds on Linux)
      #   internal/engine/netfinger/    (builds on Linux)
      #   internal/policy/adaptive/     (builds on Linux)
      #   internal/storage/store/       (pebble API — may fail without CGO)
      #   cmd/agent/ cmd/collector/     (bpf2go codegen)

      - name: Run tests (race detector enabled)
        run: |
          mkdir -p build/coverage
          go test -race -count=1 -timeout=120s -coverprofile=build/coverage/provenance.out -covermode=atomic ./internal/engine/provenance/...
          go test -race -count=1 -timeout=120s -coverprofile=build/coverage/pipeline.out -covermode=atomic ./internal/engine/pipeline/...
          go test -race -count=1 -timeout=120s -coverprofile=build/coverage/analyzer.out -covermode=atomic ./internal/engine/analyzer/...
          go test -race -count=1 -timeout=120s -coverprofile=build/coverage/collector.out -covermode=atomic ./internal/engine/collector/...
          go test -race -count=1 -timeout=120s -coverprofile=build/coverage/filter.out -covermode=atomic ./internal/engine/filter/...
          go test -race -count=1 -timeout=120s -coverprofile=build/coverage/compact.out -covermode=atomic ./internal/engine/compact/...
          go test -race -count=1 -timeout=120s -coverprofile=build/coverage/query.out -covermode=atomic ./internal/engine/query/...
          go test -race -count=1 -timeout=120s -coverprofile=build/coverage/control.out -covermode=atomic ./internal/engine/control/...
          go test -race -count=1 -timeout=120s -coverprofile=build/coverage/identity.out -covermode=atomic ./internal/engine/identity/...
          go test -race -count=1 -timeout=120s -coverprofile=build/coverage/predict.out -covermode=atomic ./internal/engine/predict/...
          go test -race -count=1 -timeout=120s -coverprofile=build/coverage/appsync.out -covermode=atomic ./internal/engine/appsync/...
          go test -race -count=1 -timeout=120s -coverprofile=build/coverage/backtrace.out -covermode=atomic ./internal/engine/backtrace/...
          go test -race -count=1 -timeout=120s -coverprofile=build/coverage/chain.out -covermode=atomic ./internal/engine/chain/...
          go test -race -count=1 -timeout=120s -coverprofile=build/coverage/container.out -covermode=atomic ./internal/engine/container/...
          go test -race -count=1 -timeout=120s -coverprofile=build/coverage/fold.out -covermode=atomic ./internal/engine/fold/...
          go test -race -count=1 -timeout=120s -coverprofile=build/coverage/taint.out -covermode=atomic ./internal/engine/taint/...
          go test -race -count=1 -timeout=120s -coverprofile=build/coverage/ja3.out -covermode=atomic ./internal/engine/ja3/...
          go test -race -count=1 -timeout=120s -coverprofile=build/coverage/stream.out -covermode=atomic ./internal/engine/stream/...
          go test -race -count=1 -timeout=120s -coverprofile=build/coverage/probe.out -covermode=atomic ./internal/engine/probe/...
          go test -race -count=1 -timeout=120s -coverprofile=build/coverage/ratelimit.out -covermode=atomic ./internal/engine/ratelimit/...
          go test -race -count=1 -timeout=120s -coverprofile=build/coverage/viz.out -covermode=atomic ./internal/engine/viz/...
          go test -race -count=1 -timeout=120s -coverprofile=build/coverage/memforensic.out -covermode=atomic ./internal/engine/memforensic/...

      - name: Run storage and policy tests (race detector enabled)
        run: |
          go test -race -count=1 -timeout=120s -coverprofile=build/coverage/store.out -covermode=atomic ./internal/storage/store/...
          go test -race -count=1 -timeout=120s -coverprofile=build/coverage/cache.out -covermode=atomic ./internal/storage/cache/...
          go test -race -count=1 -timeout=120s -coverprofile=build/coverage/schema.out -covermode=atomic ./internal/storage/schema/...
          go test -race -count=1 -timeout=120s -coverprofile=build/coverage/graphdb.out -covermode=atomic ./internal/storage/graphdb/...
          go test -race -count=1 -timeout=120s -coverprofile=build/coverage/snapshot.out -covermode=atomic ./internal/storage/snapshot/...
          go test -race -count=1 -timeout=120s -coverprofile=build/coverage/export.out -covermode=atomic ./internal/storage/export/...
          go test -race -count=1 -timeout=120s -coverprofile=build/coverage/grpcexport.out -covermode=atomic ./internal/storage/grpcexport/...
          go test -race -count=1 -timeout=120s -coverprofile=build/coverage/pebblestore.out -covermode=atomic ./internal/storage/pebblestore/...
          go test -race -count=1 -timeout=120s -coverprofile=build/coverage/graphsketch.out -covermode=atomic ./internal/stitcher/graphsketch/...
          go test -race -count=1 -timeout=120s -coverprofile=build/coverage/supplychain.out -covermode=atomic ./internal/policy/supplychain/...
          go test -race -count=1 -timeout=120s -coverprofile=build/coverage/blastradius.out -covermode=atomic ./internal/policy/blastradius/...

      # ── Coverage aggregation and quality gate ─────────────────
      - name: Aggregate coverage and check threshold
        run: |
          echo "mode: atomic" > build/coverage/merged.out
          for f in build/coverage/*.out; do
            tail -n +2 "$f" >> build/coverage/merged.out
          done
          go tool cover -func=build/coverage/merged.out > build/coverage/coverage.txt
          echo "=== Coverage Summary ==="
          tail -5 build/coverage/coverage.txt
          total=$(grep '^total:' build/coverage/coverage.txt | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${total}%"
          if (( $(echo "$total < 20" | bc -l) )); then
            echo "FAIL: total coverage ${total}% < 20%"
            exit 1
          fi

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/coverage/

      - name: Check Go vet
        run: |
          go vet ./internal/engine/provenance/...
          go vet ./internal/engine/pipeline/...
          go vet ./internal/engine/analyzer/...
          go vet ./internal/engine/collector/...
          go vet ./internal/engine/filter/...
          go vet ./internal/engine/compact/...
          go vet ./internal/engine/query/...
          go vet ./internal/engine/control/...

  loader-smoke:
    name: loader smoke (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: |
            go.mod
            go.sum

      - name: Install loader smoke dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang llvm libbpf-dev linux-tools-common linux-tools-generic make

      - name: Run kernel probe
        run: |
          bash build/kernel_probe.sh

      - name: Run loader smoke validation
        run: |
          sudo make loader-smoke
