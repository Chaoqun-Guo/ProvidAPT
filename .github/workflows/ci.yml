name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GOTOOLCHAIN: auto
  GOPROXY: https://proxy.golang.org,direct

jobs:
  build:
    name: release scoped (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.3"
          cache-dependency-path: |
            go.mod
            go.sum

      - name: Download module dependencies
        run: |
          set -o pipefail
          pwd
          ls -la
          test -f go.mod || {
            listing="$(pwd; ls -la)"
            message="$(printf '%s' "$listing" | head -c 8000 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            echo "::error title=go.mod not found in CI workspace::$message"
            exit 1
          }
          go version
          go env GOVERSION GOTOOLCHAIN GOPROXY GOSUMDB
          if ! output="$(go mod download all 2>&1)"; then
            echo "$output"
            message="$(printf '%s' "$output" | head -c 8000 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            echo "::error title=go mod download failed::$message"
            exit 1
          fi

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang llvm libbpf-dev linux-tools-common linux-tools-generic linux-tools-azure linux-cloud-tools-azure
          sudo apt-get install -y -qq "linux-tools-$(uname -r)" "linux-cloud-tools-$(uname -r)" || true
          bpftool_path="$(find /usr/lib/linux-tools* -type f -name bpftool 2>/dev/null | sort -V | tail -n 1)"
          if [ -n "$bpftool_path" ]; then
            sudo ln -sf "$bpftool_path" /usr/local/bin/bpftool
          fi
          bpftool version

      - name: Run release-scoped validation
        run: |
          go test ./pkg/ticketing ./pkg/config ./pkg/api ./pkg/notify ./pkg/telemetry ./pkg/alertflow
          go test ./pkg/archive ./pkg/backup ./internal/storage/format ./internal/engine/container
          go test ./pkg/releasecheck ./pkg/controlplaneha ./cmd/cli/providaptctl ./cmd/cli/providapt-sign
          go test ./internal/policy/rulescanner ./internal/policy/response ./internal/policy/deception
          go test ./internal/storage/store ./internal/engine/compact ./internal/stitcher/graphsketch ./internal/engine/edgereduce
          GOOS=linux go test -c ./cmd/agent/daemon
          GOOS=linux go test -c -tags bpf ./cmd/agent/daemon

      - name: PostgreSQL HA integration
        run: |
          cleanup() { docker rm -f providapt-ci-postgres >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run -d --name providapt-ci-postgres \
            -e POSTGRES_DB=providapt \
            -e POSTGRES_USER=providapt \
            -e POSTGRES_PASSWORD=providapt-ci-pass \
            -p 15432:5432 postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec providapt-ci-postgres pg_isready -U providapt -d providapt && break
            sleep 1
          done
          PROVIDAPT_TEST_POSTGRES_DSN='postgresql://providapt:providapt-ci-pass@127.0.0.1:15432/providapt?sslmode=disable' \
            go test ./pkg/controlplaneha -run TestCoordinatorPostgresIntegration -count=1

  commercial-release:
    name: commercial release and package smoke
    runs-on: ubuntu-24.04
    env:
      BUILD_EBPF: "1"
      GO_TAGS: "bpf"
      RUN_SCANS: "auto"
      SIGN_CHECKSUMS: "auto"
      PACKAGE_FORMATS: "all"
      SYFT_IMAGE: anchore/syft:v1.38.0
      GRYPE_IMAGE: anchore/grype:v0.104.0
      TRIVY_IMAGE: aquasec/trivy:0.67.2
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.3"
          cache-dependency-path: |
            go.mod
            go.sum

      - name: Install package tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential fakeroot rpm tar gzip make clang llvm libbpf-dev linux-tools-common linux-tools-generic linux-tools-azure linux-cloud-tools-azure
          sudo apt-get install -y -qq "linux-tools-$(uname -r)" "linux-cloud-tools-$(uname -r)" || true
          bpftool_path="$(find /usr/lib/linux-tools* -type f -name bpftool 2>/dev/null | sort -V | tail -n 1)"
          if [ -n "$bpftool_path" ]; then
            sudo ln -sf "$bpftool_path" /usr/local/bin/bpftool
          fi
          bpftool version

      - name: Build commercial release artifacts
        run: |
          make release-commercial

      - name: Validate SBOM inventory
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          spdx = json.loads(Path("dist/sbom.spdx.json").read_text())
          cdx = json.loads(Path("dist/sbom.cdx.json").read_text())
          assert len(spdx.get("packages", [])) > 0, "SPDX SBOM has no packages"
          assert len(cdx.get("components", [])) > 0, "CycloneDX SBOM has no components"
          PY

      - name: Run package smoke matrix
        run: |
          make package-smoke-matrix

      - name: Validate package manifest
        run: |
          test -f packaging/nfpm.yaml
          grep -q "providaptd" packaging/nfpm.yaml
          grep -q "providapt.service" packaging/nfpm.yaml

  centos-compat:
    name: centos compatibility smoke
    runs-on: ubuntu-24.04
    container:
      image: quay.io/centos/centos:stream9
    steps:
      - uses: actions/checkout@v5

      - name: Install Go
        run: |
          dnf install -y golang git gcc make findutils tar gzip
          go version

      - name: Run CentOS scoped tests
        run: |
          go test ./pkg/config ./pkg/backup ./pkg/api ./pkg/releasecheck
          GOOS=linux go test -c ./cmd/agent/daemon

  loader-smoke:
    name: loader smoke (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.3"
          cache-dependency-path: |
            go.mod
            go.sum

      - name: Install loader smoke dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang llvm libbpf-dev linux-tools-common linux-tools-generic linux-tools-azure linux-cloud-tools-azure make
          sudo apt-get install -y -qq "linux-tools-$(uname -r)" "linux-cloud-tools-$(uname -r)" || true
          bpftool_path="$(find /usr/lib/linux-tools* -type f -name bpftool 2>/dev/null | sort -V | tail -n 1)"
          if [ -n "$bpftool_path" ]; then
            sudo ln -sf "$bpftool_path" /usr/local/bin/bpftool
          fi
          bpftool version

      - name: Run kernel probe
        run: |
          bash build/kernel_probe.sh

      - name: Run loader smoke validation
        run: |
          sudo make loader-smoke
