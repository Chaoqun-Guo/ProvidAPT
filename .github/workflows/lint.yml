# Lint Pipeline
# Runs golangci-lint on every PR.

name: Lint

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GOTOOLCHAIN: auto
  GOPROXY: https://proxy.golang.org,direct

jobs:
  golangci:
    name: golangci-lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.3"
          cache-dependency-path: |
            go.mod
            go.sum

      # golangci-lint-action@v9 handles go mod download internally.

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: >-
            --timeout=10m
            --issues-exit-code=1
            ./internal/engine/ai/...
            ./internal/engine/analyzer/...
            ./internal/engine/appsync/...
            ./internal/engine/backtrace/...
            ./internal/engine/chain/...
            ./internal/engine/collector/...
            ./internal/engine/compact/...
            ./internal/engine/container/...
            ./internal/engine/control/...
            ./internal/engine/edgereduce/...
            ./internal/engine/filter/...
            ./internal/engine/fold/...
            ./internal/engine/graphquery/...
            ./internal/engine/identity/...
