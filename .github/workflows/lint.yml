# ── Lint Pipeline ─────────────────────────────────────────────
# Runs golangci-lint on every PR.

name: Lint

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  GO_VERSION: "1.25.0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  golangci:
    name: golangci-lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.mod
            go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: >-
            --timeout=5m
            ./pkg/alertflow/...
            ./pkg/api/...
            ./pkg/config/...
            ./pkg/notify/...
            ./pkg/supportbundle/...
            ./pkg/telemetry/...
            ./pkg/ticketing/...
            ./internal/engine/ai/...
            ./internal/engine/loader/...
            ./internal/policy/mgmt/...
