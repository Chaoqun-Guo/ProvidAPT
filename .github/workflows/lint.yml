# Lint Pipeline
# Runs golangci-lint on every PR.

name: Lint

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GOTOOLCHAIN: auto
  GOPROXY: https://proxy.golang.org,direct

jobs:
  golangci:
    name: golangci-lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.3"
          cache-dependency-path: |
            go.mod
            go.sum

      # golangci-lint-action@v9 handles go mod download internally.

      - name: Verify module workspace
        run: |
          pwd
          ls -la
          test -f go.mod || {
            listing="$(pwd; ls -la)"
            message="$(printf '%s' "$listing" | head -c 8000 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            echo "::error title=go.mod not found in lint workspace::$message"
            exit 1
          }

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: >-
            --timeout=10m
            --issues-exit-code=1
            ./internal/engine/compact/...
            ./internal/engine/container/...
            ./internal/engine/edgereduce/...
            ./internal/policy/deception/...
            ./internal/policy/response/...
            ./internal/policy/rulescanner/...
            ./internal/storage/format/...
            ./internal/storage/store/...
            ./internal/stitcher/graphsketch/...
            ./pkg/alertflow/...
            ./pkg/api/...
            ./pkg/archive/...
            ./pkg/config/...
            ./pkg/notify/...
            ./pkg/releasecheck/...
            ./pkg/telemetry/...
            ./pkg/ticketing/...
