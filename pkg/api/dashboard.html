<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProvidAPT Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d1117; color: #c9d1d9; min-height: 100vh; }
header { background: #161b22; border-bottom: 1px solid #30363d; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
header h1 { color: #58a6ff; font-size: 20px; }
header .subtitle { color: #8b949e; font-size: 12px; margin-top: 2px; }
header .status-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 600; }
.status-badge.healthy { background: #1a3a2a; color: #3fb950; border: 1px solid #238636; }
.status-badge.unhealthy { background: #3a1a1a; color: #f85149; border: 1px solid #da3633; }
.status-badge.unknown { background: #1a1a2a; color: #d29922; border: 1px solid #9e6a03; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.healthy .status-dot { background: #3fb950; }
.unhealthy .status-dot { background: #f85149; }
.unknown .status-dot { background: #d29922; }
.refresh-info { color: #8b949e; font-size: 10px; }

.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; padding: 20px 24px; }
.card { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 16px; }
.card .value { font-size: 28px; font-weight: 700; color: #58a6ff; }
.card .label { font-size: 11px; color: #8b949e; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
.card .sub { font-size: 11px; color: #484f58; margin-top: 2px; }

.content { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 0 24px 24px; }
@media (max-width: 900px) { .content { grid-template-columns: 1fr; } }

.panel { background: #161b22; border: 1px solid #30363d; border-radius: 6px; overflow: hidden; }
.panel h2 { font-size: 13px; color: #8b949e; text-transform: uppercase; letter-spacing: 0.5px; padding: 12px 16px; border-bottom: 1px solid #21262d; }
.panel-body { padding: 12px 16px; }

#graph-container { height: 400px; background: #0d1117; }

.alerts-list { max-height: 360px; overflow-y: auto; }
.alert-item { padding: 8px 12px; border-bottom: 1px solid #21262d; font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
.alert-item:last-child { border-bottom: none; }
.alert-sev { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 10px; font-weight: 600; }
.sev-critical { background: #3a1a1a; color: #f85149; }
.sev-high { background: #3a2a1a; color: #d29922; }
.sev-medium { background: #1a2a3a; color: #58a6ff; }
.sev-low { background: #1a1a2a; color: #8b949e; }
.alert-time { color: #484f58; font-size: 11px; }
.alert-msg { flex: 1; margin: 0 12px; }

.loading { color: #8b949e; text-align: center; padding: 24px; font-size: 13px; }
.error { color: #f85149; text-align: center; padding: 12px; font-size: 13px; }
</style>
</head>
<body>

<header>
  <div>
    <h1>ProvidAPT</h1>
    <div class="subtitle">Provenance-driven APT Detection</div>
  </div>
  <div style="display:flex;align-items:center;gap:12px">
    <span class="status-badge unknown" id="statusBadge">
      <span class="status-dot"></span>
      <span id="statusText">Loading</span>
    </span>
    <span class="refresh-info" id="refreshInfo">--</span>
  </div>
</header>

<div class="metrics" id="metrics">
  <div class="card"><div class="value" id="mNodes">--</div><div class="label">Graph Nodes</div></div>
  <div class="card"><div class="value" id="mEdges">--</div><div class="label">Graph Edges</div></div>
  <div class="card"><div class="value" id="mEvents">--</div><div class="label">Events Ingested</div></div>
  <div class="card"><div class="value" id="mDropped">--</div><div class="label">Events Dropped</div></div>
  <div class="card"><div class="value" id="mMemory">--</div><div class="label">Memory</div></div>
  <div class="card"><div class="value" id="mUptime">--</div><div class="label">Uptime</div></div>
</div>

<div class="content">
  <div class="panel">
    <h2>Provenance Graph</h2>
    <div id="graph-container"></div>
  </div>
  <div class="panel">
    <h2>Recent Alerts</h2>
    <div class="alerts-list" id="alertsList">
      <div class="loading">Loading alerts...</div>
    </div>
  </div>
</div>

<script>
let cy = null;
let lastStatus = 'unknown';

async function fetchJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(r.statusText);
  return r.json();
}

function formatBytes(b) {
  if (!b) return '0 B';
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b/1024).toFixed(1) + ' KB';
  if (b < 1073741824) return (b/1048576).toFixed(1) + ' MB';
  return (b/1073741824).toFixed(2) + ' GB';
}

function formatUptime(s) {
  if (!s) return '--';
  const d = Math.floor(s/86400);
  const h = Math.floor((s%86400)/3600);
  const m = Math.floor((s%3600)/60);
  const parts = [];
  if (d > 0) parts.push(d + 'd');
  if (h > 0) parts.push(h + 'h');
  parts.push(m + 'm');
  return parts.join(' ');
}

function formatTime(ts) {
  if (!ts) return '--';
  const d = new Date(ts);
  return d.toLocaleTimeString();
}

function getSeverityClass(sev) {
  const s = (sev || '').toUpperCase();
  if (s === 'CRITICAL') return 'sev-critical';
  if (s === 'HIGH') return 'sev-high';
  if (s === 'MEDIUM') return 'sev-medium';
  return 'sev-low';
}

function formatSeverity(sev) {
  const s = (sev || '').toUpperCase();
  if (s === 'CRITICAL' || s === 'HIGH' || s === 'MEDIUM') return s;
  return 'INFO';
}

function updateStatus(status) {
  const badge = document.getElementById('statusBadge');
  const text = document.getElementById('statusText');
  badge.className = 'status-badge ' + (status || 'unknown');
  text.textContent = (status || 'unknown').charAt(0).toUpperCase() + (status || 'unknown').slice(1);
}

async function loadStatus() {
  try {
    const data = await fetchJSON('/api/v1/status');
    document.getElementById('mNodes').textContent = data.nodes || 0;
    document.getElementById('mEdges').textContent = data.edges || 0;
    if (data.health) updateStatus(data.health);
    if (data.uptime_seconds) document.getElementById('mUptime').textContent = formatUptime(data.uptime_seconds);
    if (data.memory_bytes) document.getElementById('mMemory').textContent = formatBytes(data.memory_bytes);
  } catch(e) { document.getElementById('mNodes').textContent = 'err'; }
}

async function loadHealth() {
  try {
    const h = await fetchJSON('/health');
    updateStatus(h.status);
    if (h.uptime_seconds) document.getElementById('mUptime').textContent = formatUptime(h.uptime_seconds);
    if (h.memory_bytes) document.getElementById('mMemory').textContent = formatBytes(h.memory_bytes);
    if (h.events_ingested != null) document.getElementById('mEvents').textContent = h.events_ingested.toLocaleString();
    if (h.events_dropped != null) document.getElementById('mDropped').textContent = h.events_dropped.toLocaleString();
  } catch(e) { /* ignore */ }
}

async function loadGraph() {
  try {
    const data = await fetchJSON('/api/v1/graph/export');
    if (!data.elements || data.elements.length === 0) return;
    if (cy) { cy.destroy(); }
    cy = cytoscape({
      container: document.getElementById('graph-container'),
      elements: data.elements,
      style: [
        { selector: 'node', style: { 'background-color': '#58a6ff', label: 'data(label)', 'color': '#c9d1d9', 'font-size': '10px', 'text-valign': 'bottom', 'text-halign': 'center', 'width': 24, 'height': 24 } },
        { selector: 'edge', style: { 'line-color': '#30363d', 'target-arrow-color': '#30363d', 'width': 1.5, 'target-arrow-shape': 'triangle', 'curve-style': 'bezier', 'label': 'data(label)', 'color': '#484f58', 'font-size': '8px' } },
        { selector: 'node[type="process"]', style: { 'background-color': '#d29922' } },
        { selector: 'node[type="file"]', style: { 'background-color': '#58a6ff' } },
        { selector: 'node[type="net"]', style: { 'background-color': '#3fb950' } },
      ],
      layout: { name: 'breadthfirst', directed: true, spacingFactor: 1.2 },
      wheelSensitivity: 0.3,
    });
  } catch(e) { /* no graph data */ }
}

async function loadAlerts() {
  try {
    const data = await fetchJSON('/api/v1/alerts');
    const list = document.getElementById('alertsList');
    const alerts = data.alerts || [];
    if (alerts.length === 0) {
      list.innerHTML = '<div class="loading">No alerts</div>';
      return;
    }
    list.innerHTML = alerts.slice(0, 20).map(a => {
      const sev = a.severity || 'info';
      return '<div class="alert-item">' +
        '<span class="alert-sev ' + getSeverityClass(sev) + '">' + formatSeverity(sev) + '</span>' +
        '<span class="alert-msg">' + (a.headline || a.pattern || a.message || 'Alert') + '</span>' +
        '<span class="alert-time">' + formatTime(a.detected_at || a.timestamp) + '</span>' +
        '</div>';
    }).join('');
  } catch(e) {
    document.getElementById('alertsList').innerHTML = '<div class="loading">No alerts available</div>';
  }
}

async function refresh() {
  const now = new Date();
  document.getElementById('refreshInfo').textContent = 'Updated: ' + now.toLocaleTimeString();
  await Promise.all([loadStatus(), loadHealth(), loadAlerts(), loadGraph()]);
}

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
