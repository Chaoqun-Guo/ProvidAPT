// ProvidAPT v2 — Data Model Definitions
// protoc --go_out=. providapt.proto

syntax = "proto3";
package providapt;
option go_package = "github.com/Chaoqun-Guo/ProvidAPT/pkg/api/proto/v2";

// ─── Node ───────────────────────────────────────────────

message Node {
  // Unique identifier: "p:<pid>", "f:<inode>:<dev>"
  string id = 1;

  // Node type: "process", "file", "network", "pipe", "memory"
  string type = 2;

  // Human-readable label: comm name, file path, IP address
  string label = 3;

  // Timestamp (UnixNano) of first and last observation
  uint64 first_seen_ns = 4;
  uint64 last_seen_ns = 5;

  // Process context (valid when type == "process")
  uint32 pid = 10;
  uint32 ppid = 11;
  uint32 uid = 12;
  string comm = 13;

  // File context (valid when type == "file")
  uint64 inode = 20;
  uint32 dev_major = 21;
  uint32 dev_minor = 22;
  uint32 mode = 23;

  // Identity context (PAM / login)
  string identity = 30;
  string session_id = 31;
  string source_ip = 32;

  // Extended attributes (key-value pairs)
  map<string, string> attrs = 40;

  // Monitoring level (0=default, 1=suspicious, 2=investigating)
  uint32 monitor_level = 50;
}

// ─── Edge ───────────────────────────────────────────────

message Edge {
  // Unique identifier
  string id = 1;

  // Source and target node IDs
  string source = 2;
  string target = 3;

  // Relation type: "used", "wasGeneratedBy", "wasInformedBy",
  // "wasDerivedFrom", "hadSecurityContext"
  string relation = 4;

  // Timestamp and aggregation
  uint64 timestamp_ns = 5;
  uint32 count = 6;

  // Weight for scoring
  float weight = 7;
}

// ─── Index Entries ─────────────────────────────────────

message PIDIndex {
  uint32 pid = 1;
  string node_id = 2;
  uint64 first_seen_ns = 3;
}

message InodeIndex {
  uint64 inode = 1;
  uint32 dev_major = 2;
  uint32 dev_minor = 3;
  string node_id = 4;
}

// ─── Event (raw ring buffer record for storage) ────────

message Event {
  uint32 type = 1;
  uint32 flags = 2;
  uint64 timestamp_ns = 3;
  uint32 pid = 4;
  uint32 tid = 5;
  uint32 ppid = 6;
  uint32 uid = 7;
  uint32 gid = 8;
  string comm = 9;
  string pathname = 10;

  // Union fields
  uint64 inode = 20;
  uint32 dev_major = 21;
  uint32 dev_minor = 22;
  uint32 mode = 23;
  uint32 f_flags = 24;
  uint32 child_pid = 25;
  uint32 saddr = 26;
  uint32 daddr = 27;
  uint32 sport = 28;
  uint32 dport = 29;
  uint32 protocol = 30;
}
