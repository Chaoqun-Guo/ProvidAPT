  <div class="panel span-2 policy-center-panel">
    <h2>Policy Center</h2>
    <div class="panel-body">
      <div class="policy-grid policy-summary-grid">
        <div class="policy-item clickable" onclick="showPolicyDetails('current')"><div class="value" id="pCurrentVersion">--</div><div class="label">Current Version</div></div>
        <div class="policy-item clickable" onclick="showPolicyDetails('draft')"><div class="value" id="pDraftState">--</div><div class="label">Draft State</div></div>
        <div class="policy-item clickable" onclick="showPolicyDetails('rules')"><div class="value" id="pActiveRules">--</div><div class="label">Active Rules</div></div>
        <div class="policy-item clickable" onclick="showPolicyDetails('history')"><div class="value" id="pHistoryCount">--</div><div class="label">History</div></div>
        <div class="policy-item clickable" onclick="showPolicyDetails('deployment')"><div class="value" id="pDeploymentStatus">--</div><div class="label">Deployment</div></div>
      </div>
      <div class="action-row policy-view-actions">
        <button data-module="policy-center" data-module-action="browse-current" onclick="showPolicyDetails('current')">Browse Current</button>
        <button data-module="policy-center" data-module-action="browse-draft" class="secondary" onclick="showPolicyDetails('draft')">Browse Draft</button>
        <button data-module="policy-center" data-module-action="browse-rules" class="secondary" onclick="showPolicyDetails('rules')">Browse Rules</button>
        <button data-module="policy-center" data-module-action="deployment" class="secondary" onclick="showPolicyDetails('deployment')">Deployment</button>
        <button data-module="policy-center" data-module-action="audit-trail" class="secondary" onclick="showPolicyDetails('history')">Audit Trail</button>
        <button data-module="policy-center" data-module-action="diff" class="secondary" onclick="showPolicyDetails('diff')">Show Diff</button>
        <button id="downloadPolicyBundleBtn" data-module="policy-center" data-module-action="download" class="secondary" onclick="downloadPolicyBundle()">Download Bundle</button>
      </div>
      <div class="policy-editor policy-center-editor">
        <textarea id="policyEditNotes" class="policy-notes" placeholder="Edit policy release notes, rule change reason, or deployment instruction"></textarea>
        <div class="policy-grid policy-rule-fields">
          <input id="policyTargetGroup" placeholder="Target group (optional)">
          <input id="policyTargetTag" placeholder="Target tag (optional)">
          <input id="policyRuleID" placeholder="Sigma rule ID">
          <input id="policyWhitelistTarget" placeholder="Whitelist target: pid, comm, path">
          <input id="policyWhitelistValue" placeholder="Whitelist value">
          <input id="policyTaintPrefix" placeholder="Taint IP prefix or source">
          <input id="policyTaintLabel" placeholder="Taint label">
        </div>
        <textarea id="policyRuleYAML" class="policy-yaml" placeholder="Sigma rule YAML for add/update"></textarea>
        <div class="action-row policy-rule-actions" style="margin:0;align-content:start;">
          <button data-module="policy-center" data-module-action="add-sigma" class="secondary" onclick="preparePolicyMutation('add_sigma')">Add Sigma</button>
          <button data-module="policy-center" data-module-action="validate-sigma" class="secondary" onclick="preparePolicyMutation('validate_sigma')">Validate Sigma</button>
          <button data-module="policy-center" data-module-action="update-sigma" class="secondary" onclick="preparePolicyMutation('update_sigma')">Update Sigma</button>
          <button data-module="policy-center" data-module-action="remove-sigma" class="secondary" onclick="preparePolicyMutation('remove_sigma')">Remove Sigma</button>
          <button data-module="policy-center" data-module-action="add-whitelist" class="secondary" onclick="preparePolicyMutation('add_whitelist')">Add Whitelist</button>
          <button data-module="policy-center" data-module-action="remove-whitelist" class="secondary" onclick="preparePolicyMutation('remove_whitelist')">Remove Whitelist</button>
          <button data-module="policy-center" data-module-action="add-taint" class="secondary" onclick="preparePolicyMutation('add_taint')">Add Taint</button>
          <button data-module="policy-center" data-module-action="remove-taint" class="secondary" onclick="preparePolicyMutation('remove_taint')">Remove Taint</button>
          <button data-module="policy-center" data-module-action="load-example" class="secondary" onclick="loadExamplePolicyRule()">Load Example Rule</button>
        </div>
        <div class="action-row policy-publish-actions" style="margin:0;align-content:start;">
          <button id="publishPolicyBtn" data-module="policy-center" data-module-action="publish" onclick="preparePolicyAction('publish')">Publish Draft</button>
          <button id="rollbackPolicyBtn" data-module="policy-center" data-module-action="rollback" class="secondary" onclick="preparePolicyAction('rollback')">Rollback</button>
        </div>
      </div>
      <div class="loading" id="policyActionStatus"></div>
      <div class="loading" style="margin-top:12px;">Recent Policy Actions</div>
      <div class="alerts-list" id="policyHistoryList">
        <div class="loading">Loading policy actions...</div>
      </div>
    </div>
  </div>
