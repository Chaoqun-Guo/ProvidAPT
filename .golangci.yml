# ── Golangci-lint Configuration ───────────────────────────────
# https://golangci-lint.run/usage/configuration/
#
# Usage:
#   golangci-lint run ./...
#   golangci-lint run --config .golangci.yml ./pkg/...

version: "2"

run:
  timeout: 5m
  go: "1.25"
  issues-exit-code: 1
  tests: true
  modules-download-mode: readonly

output:
  formats:
    text:
      path: stdout
      colors: true
      print-issued-lines: true
      print-linter-name: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - errorlint
    - forcetypeassert
    - misspell
    - nakedret
    - noctx
    - unconvert
    - unparam
  disable:
    - lll  # long lines (too noisy)
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gocyclo
          - errcheck
          - forcetypeassert
          - noctx
          - errorlint
      - path: pkg/api/proto/
        linters:
          - revive
          - forcetypeassert
          - staticcheck
      - path: internal/engine/loader/bpf/
        linters:
          - govet
          - staticcheck
      - text: "SA1019"
        linters:
          - staticcheck
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    misspell:
      locale: US
    nakedret:
      max-func-lines: 30

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 50
  max-same-issues: 10
