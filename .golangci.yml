# ── Golangci-lint Configuration ───────────────────────────────
# https://golangci-lint.run/usage/configuration/
#
# Usage:
#   golangci-lint run ./...
#   golangci-lint run --config .golangci.yml ./pkg/...

version: "2"

run:
  timeout: 5m
  go: "1.25.0"
  issues-exit-code: 1
  tests: true

output:
  formats:
    text:
      path: stdout
      colors: true
      print-issued-lines: true
      print-linter-name: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - errorlint
    - forcetypeassert
    - misspell
    - nakedret
    - noctx
    - unconvert
    - unparam
  disable:
    - lll  # long lines (too noisy)
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gocyclo
          - errcheck
          - forcetypeassert
          - noctx
          - errorlint
      - path: pkg/api/proto/
        linters:
          - revive
          - forcetypeassert
          - staticcheck
      - path: internal/engine/loader/bpf/
        linters:
          - govet
          - staticcheck
      - text: "SA1019"
        linters:
          - staticcheck
      - path: pkg/api/proto/mgmt/service\.go
        linters:
          - errcheck
      # The AI package intentionally uses British spelling in identifiers
      # (Analyse, AnalysePrompt) and comments (neighbourhood, MITRE).
      - path: internal/engine/ai/
        linters:
          - misspell
  settings:
    errcheck:
      # Single-value type assertions (without _,ok) panic on failure,
      # which is the idiomatic pattern for protobuf dispatch handlers.
      check-type-assertions: false
      # _ = expr is the Go-idiomatic way to explicitly discard errors
      # (e.g. deferred Close, best-effort cleanup). Do not flag it.
      check-blank: false
    misspell:
      locale: US
    nakedret:
      max-func-lines: 30

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 50
  max-same-issues: 10
