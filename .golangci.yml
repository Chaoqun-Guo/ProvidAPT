# ── Golangci-lint Configuration ───────────────────────────────
# https://golangci-lint.run/usage/configuration/
#
# Usage:
#   golangci-lint run ./...

version: "2"

run:
  timeout: 5m
  go: "1.25"
  issues-exit-code: 1
  tests: true
  modules-download-mode: readonly

output:
  formats:
    - format: colored-line-number
  print-issued-lines: true
  print-linter-name: true

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - typecheck
    - unused
    - bodyclose
    - errorlint
    - forcetypeassert
    - gocyclo
    - gofmt
    - goimports
    - misspell
    - nakedret
    - noctx
    - prealloc
    - revive
    - unconvert
    - unparam
  disable:
    - lll  # long lines (too noisy)
  presets:
    - bugs
    - performance
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gocyclo
          - errcheck
          - forcetypeassert
      - path: internal/engine/loader/bpf/
        linters:
          - govet
          - staticcheck
      - text: "SA1019"
        linters:
          - staticcheck

linters-settings:
  gocyclo:
    min-complexity: 20
  errcheck:
    check-type-assertions: true
    check-blank: true
  misspell:
    locale: US
  nakedret:
    max-func-lines: 30
  revive:
    rules:
      - name: exported
        severity: warning
        disabled: false
      - name: blank-imports
        severity: warning
      - name: context-as-argument
        severity: warning
      - name: error-return
        severity: warning
      - name: error-naming
        severity: warning

issues:
  max-issues-per-linter: 50
  max-same-issues: 10
