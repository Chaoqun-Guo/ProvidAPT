openapi: "3.0.3"
info:
  title: ProvidAPT API
  description: Provenance-based APT detection and graph analysis API
  version: "2.0.0"
  contact:
    name: ProvidAPT Team

servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://localhost:8080
    description: TLS-enabled

paths:
  /health:
    get:
      summary: Health check
      description: Returns daemon health status including eBPF, pipeline, and store health
      operationId: getHealth
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Service is unhealthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /api/v1/status:
    get:
      summary: Daemon status
      description: Returns running status, node/edge counts, and optional health info
      operationId: getStatus
      responses:
        "200":
          description: Status information
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: running
                  nodes:
                    type: integer
                  edges:
                    type: integer
                  timestamp:
                    type: string
                    format: date-time

  /api/v1/graph/export:
    get:
      summary: Export provenance graph
      description: Returns the graph in Cytoscape.js-compatible JSON format
      operationId: exportGraph
      parameters:
        - name: pid
          in: query
          schema:
            type: string
          description: Filter by process ID (e.g. "1234")
      responses:
        "200":
          description: Cytoscape.js graph JSON
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/CytoMeta"
                  elements:
                    type: array
                    items:
                      $ref: "#/components/schemas/CytoElement"

  /api/v1/graph/node/{id}/backward:
    get:
      summary: Backward trace
      description: Trace backward from a node to find ancestor paths
      operationId: traceBackward
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Node ID
        - name: depth
          in: query
          schema:
            type: integer
            default: 5
          description: Maximum trace depth
      responses:
        "200":
          description: Traced subgraph in Cytoscape.js format

  /api/v1/graph/node/{id}/forward:
    get:
      summary: Forward trace
      description: Trace forward from a node to find descendant paths
      operationId: traceForward
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: depth
          in: query
          schema:
            type: integer
            default: 5
      responses:
        "200":
          description: Traced subgraph in Cytoscape.js format

  /api/v1/alerts:
    get:
      summary: List alerts
      description: Returns all triggered alerts
      operationId: listAlerts
      responses:
        "200":
          description: Alert list
          content:
            application/json:
              schema:
                type: object
                properties:
                  alerts:
                    type: array
                    items:
                      type: object
                  count:
                    type: integer

  /api/v1/alerts/{id}/svg:
    get:
      summary: Alert SVG snapshot
      description: Returns an SVG visualization of the alert context graph
      operationId: getAlertSVG
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: SVG image
          content:
            image/svg+xml:
              schema:
                type: string
                format: binary

  /api/v1/admin/reload:
    post:
      summary: Reload configuration
      description: Triggers a hot reload of daemon configuration
      operationId: reloadConfig
      responses:
        "200":
          description: Reload triggered
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: reload triggered
        "405":
          description: Method not allowed (use POST)

  /api/v1/events/search:
    get:
      summary: Search events
      description: Search ingested events by criteria
      operationId: searchEvents
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: Search query
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
      responses:
        "200":
          description: Search results

  /api/v1/events/recent:
    get:
      summary: Recent events
      description: Returns the most recently ingested events
      operationId: getRecentEvents
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Recent events list

  /metrics:
    get:
      summary: Prometheus metrics
      description: Returns Prometheus-format metrics
      operationId: getMetrics
      responses:
        "200":
          description: Prometheus metrics text

  /dashboard:
    get:
      summary: Web dashboard
      description: Live web-based provenance graph dashboard
      operationId: getDashboard
      responses:
        "200":
          description: HTML dashboard page
          content:
            text/html:
              schema:
                type: string

  /ready:
    get:
      summary: Readiness probe
      description: Returns 200 when the daemon is ready to serve traffic
      operationId: getReady
      responses:
        "200":
          description: Ready

  /api/v1/control/overview:
    get:
      summary: Cluster overview
      description: Returns cluster-wide health and agent group aggregation
      operationId: getClusterOverview
      responses:
        "200":
          description: Cluster overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterOverview"

  /api/v1/control/fleet:
    get:
      summary: Fleet management
      description: List and manage fleet of agents by group/tag
      operationId: getFleet
      parameters:
        - name: group
          in: query
          schema:
            type: string
        - name: tag
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Fleet list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FleetList"

  /api/v1/control/support:
    get:
      summary: Support bundles
      description: List generated support bundles
      operationId: getSupportBundles
      responses:
        "200":
          description: Support bundle summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportBundleSummary"

  /api/v1/control/support/download:
    get:
      summary: Download support bundle
      description: Download the latest support bundle archive
      operationId: downloadSupportBundle
      responses:
        "200":
          description: Binary support bundle archive

  /api/v1/control/backup:
    get:
      summary: Backup status
      description: Returns checkpoint backup, restore staging, and cutover history
      operationId: getBackupStatus
      responses:
        "200":
          description: Backup status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupSummary"
    post:
      summary: Run backup action
      description: Create checkpoint backups, restore to staging, or prepare a restore cutover plan
      operationId: runBackupAction
      responses:
        "200":
          description: Backup action result

  /api/v1/control/backup/download:
    get:
      summary: Download backup
      description: Download the latest checkpoint backup archive
      operationId: downloadBackup
      responses:
        "200":
          description: Binary checkpoint backup archive

  /api/v1/control/security:
    get:
      summary: Security rotation status
      description: Returns TLS certificate rotation readiness and history
      operationId: getSecurityStatus
      responses:
        "200":
          description: Security status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityStatus"
    post:
      summary: Run security action
      description: Check or rotate the server TLS certificate
      operationId: runSecurityAction
      responses:
        "200":
          description: Security action result

  /api/v1/control/audit:
    get:
      summary: Audit log
      description: List control-plane audit trail entries
      operationId: getAuditLog
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: source
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Audit feed

  /api/v1/control/license:
    get:
      summary: License status
      description: Returns current license information and history
      operationId: getLicenseStatus
      responses:
        "200":
          description: License status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LicenseStatus"

  /api/v1/control/upgrade:
    get:
      summary: Upgrade readiness
      description: Check upgrade readiness and current version
      operationId: getUpgradeReadiness
      responses:
        "200":
          description: Upgrade readiness
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradeReadiness"

  /api/v1/control/policies:
    get:
      summary: Policy center
      description: List and manage detection/response policies
      operationId: getPolicies
      responses:
        "200":
          description: Policy center data

  /api/v1/control/alerts:
    get:
      summary: Alert workflow
      description: Manage alert workflow (triage, assign, resolve)
      operationId: getAlertWorkflow
      responses:
        "200":
          description: Alert workflow items

  /api/v1/control/deliveries:
    get:
      summary: Notifications and deliveries
      description: View and manage notification channel delivery status
      operationId: getDeliveries
      responses:
        "200":
          description: Notification delivery center

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, unhealthy, unknown]
        uptime_seconds:
          type: integer
        ebpf_collector:
          type: boolean
        pipeline_healthy:
          type: boolean
        store_healthy:
          type: boolean
        events_ingested:
          type: integer
        events_dropped:
          type: integer
        memory_bytes:
          type: integer
        version:
          type: string
        sanity_check:
          type: string
          enum: [pass, fail]

    CytoMeta:
      type: object
      properties:
        generated:
          type: string
          format: date-time
        node_count:
          type: integer
        edge_count:
          type: integer

    CytoElement:
      type: object
      properties:
        group:
          type: string
          enum: [nodes, edges]
        data:
          type: object
          properties:
            id:
              type: string
            source:
              type: string
            target:
              type: string
            label:
              type: string
            type:
              type: string
            class:
              type: string

    ClusterOverview:
      type: object
      properties:
        updated_at:
          type: string
          format: date-time
        total_agents:
          type: integer
        healthy_agents:
          type: integer
        degraded_agents:
          type: integer
        agents:
          type: array
          items:
            $ref: "#/components/schemas/ClusterAgent"

    ClusterAgent:
      type: object
      properties:
        id:
          type: string
        hostname:
          type: string
        status:
          type: string
        version:
          type: string
        last_seen:
          type: string
          format: date-time

    FleetList:
      type: object
      properties:
        updated_at:
          type: string
          format: date-time
        group:
          type: string
        tag:
          type: string
        agents:
          type: array
          items:
            $ref: "#/components/schemas/ClusterAgent"

    SupportBundleSummary:
      type: object
      properties:
        last_bundle_path:
          type: string
        last_status:
          type: string
        last_bundle_at:
          type: string
          format: date-time
        download_url:
          type: string

    BackupSummary:
      type: object
      properties:
        last_backup_path:
          type: string
        last_restore_path:
          type: string
        last_status:
          type: string
        last_backup_at:
          type: string
          format: date-time
        size_bytes:
          type: integer
          format: int64
        download_url:
          type: string

    SecurityStatus:
      type: object
      properties:
        updated_at:
          type: string
          format: date-time
        cert_file:
          type: string
        ca_file:
          type: string
        rotation_needed:
          type: boolean
        last_status:
          type: string
        last_rotated_at:
          type: string
          format: date-time

    LicenseStatus:
      type: object
      properties:
        updated_at:
          type: string
          format: date-time
        licensed:
          type: boolean
        plan:
          type: string
        expires_at:
          type: string
          format: date-time

    UpgradeReadiness:
      type: object
      properties:
        updated_at:
          type: string
          format: date-time
        ready:
          type: boolean
        current_tag:
          type: string
        latest_tag:
          type: string
        description:
          type: string
